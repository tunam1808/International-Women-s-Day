<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>2024 - Khởi đầu</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #ffe4ec, #f3e8ff);
        font-family: "Poppins", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
      }

      .card {
        background: white;
        max-width: 90%;
        width: 90%;
        min-height: 90vh;
        margin: 20px auto;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(236, 72, 153, 0.15);
        gap: 30px;
      }

      h1 {
        font-family: "Great Vibes", cursive;
        color: #ec4899;
        font-size: 3.8rem;
        margin: 0;
        text-align: center;
      }

      .music-control {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 0px 0 5px 0;
      }

      .music-btn {
        background: #f9a8d4;
        color: white;
        border: none;
        border-radius: 50%;
        width: 52px;
        height: 52px;
        font-size: 1.9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        transition: all 0.3s ease;
      }

      .music-btn:hover {
        transform: scale(1.1);
        background: #ec4899;
        box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5);
      }

      .music-text {
        color: #ec4899;
        font-size: 1.05rem;
        font-weight: 500;
      }

      .main-photo {
        width: 100%;
        max-width: 400px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      }

      .main-photo img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: cover;
      }

      .message {
        max-width: 700px;
        background: #fff0f7;
        border-radius: 16px;
        padding: 30px;
        font-family: "Dancing Script", cursive;
        font-size: 1.8rem;
        line-height: 1.6;
        text-align: center;
        color: #ec4899;
        box-shadow: 0 6px 20px rgba(236, 72, 153, 0.2);
      }

      .nav-buttons {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 500px;
        margin-top: 40px;
        gap: 20px;
      }

      .nav-btn {
        flex: 1;
        font-size: 1.3rem;
        padding: 14px 28px;
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
        border-radius: 50px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .nav-btn.left {
        background: #fff0f7;
        color: #ec4899;
        border: 2px solid #ec4899;
      }

      .nav-btn.left:hover {
        background: #ec4899;
        color: white;
      }

      .nav-btn.right {
        background: #fff0f7;
        color: #ec4899;
        border: 2px solid #ec4899;
      }

      .nav-btn.right:hover {
        background: #ec4899;
        color: white;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .card {
          padding: 30px 15px;
          gap: 25px;
        }
        h1 {
          font-size: 3.2rem;
        }
        .music-control {
          margin: -20px 0 -10px 0;
          gap: 10px;
        }
        .music-btn {
          width: 48px;
          height: 48px;
          font-size: 1.7rem;
        }
        .music-text {
          font-size: 1rem;
        }
        .main-photo {
          max-width: 90%;
        }
        .message {
          font-size: 1.6rem;
          padding: 25px;
        }
        .nav-buttons {
          flex-direction: column;
          align-items: center;
        }
        .nav-btn {
          width: 100%;
          max-width: 220px;
        }
      }
    </style>
  </head>

  <body>
    <audio id="bgMusic" loop preload="auto">
      <source src="nhac.mp3" type="audio/mpeg" />
    </audio>

    <div class="card">
      <h1>🌸 8/3/2024</h1>

      <div class="music-control">
        <button class="music-btn" id="musicBtn">▶️</button>
        <span class="music-text" id="musicText">Phát nhạc</span>
      </div>

      <div class="main-photo">
        <img src="832024.jpg" alt="Ảnh kỷ niệm đặc biệt" />
      </div>

      <div class="message">
        Chắc đây là món quà đầu tiên tôi tặng bạn, giờ lâu rồi cũng không nhớ
        hình dạng cụ thể của nó nữa nhưng mà nó là con này, tặng khi cả 2 đứa
        chung ô về sau tập văn nghệ ấy
      </div>

      <div class="nav-buttons">
        <button
          class="nav-btn left"
          onclick="window.location.href = 'page2.html'"
        >
          ⬅ Quay lại
        </button>
        <button
          class="nav-btn right"
          onclick="window.location.href = 'page4.html'"
        >
          Đọc tiếp ➜
        </button>
      </div>
    </div>

    <script>
      // ===================== AUDIO LOGIC (tối ưu cho mobile + Vercel) =====================
      const music = document.getElementById("bgMusic");
      const musicBtn = document.getElementById("musicBtn");
      const musicText = document.getElementById("musicText");
      let playing = false;
      let hasUserInteracted = localStorage.getItem("audioUnlocked") === "true";

      music.volume = 0.35;
      music.preload = "metadata";

      // Hàm thử play với fade-in
      function attemptPlay() {
        const playPromise = music.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              music.volume = 0;
              let vol = 0;
              const fadeIn = setInterval(() => {
                vol += 0.04;
                music.volume = Math.min(vol, 0.35);
                if (vol >= 0.35) clearInterval(fadeIn);
              }, 80);
              if (musicText) musicText.textContent = "Tắt nhạc";
            })
            .catch((err) => {
              console.log("Play error:", err);
              if (err.name === "NotAllowedError" && playing) {
                if (musicText)
                  musicText.textContent = "Ấn bất kỳ đâu để tiếp tục nhạc 💕";
              }
            });
        }
      }

      // Load state khi trang mở
      window.addEventListener("load", () => {
        const savedState = localStorage.getItem("musicState");
        if (savedState) {
          try {
            const state = JSON.parse(savedState);
            playing = state.playing;
            const savedTime = parseFloat(state.currentTime) || 0;

            if (playing) {
              music.currentTime = savedTime;
              if (musicBtn) musicBtn.textContent = "⏸️";
              if (musicText) musicText.textContent = "Tắt nhạc";

              // Nếu đã unlock trước đó → tự resume
              if (hasUserInteracted) {
                attemptPlay();
              }
            }
          } catch (e) {
            console.log("Lỗi load state:", e);
          }
        }
      });

      // Toggle nhạc
      function toggleMusic() {
        hasUserInteracted = true;
        localStorage.setItem("audioUnlocked", "true");

        if (playing) {
          music.pause();
          if (musicBtn) musicBtn.textContent = "▶️";
          if (musicText) musicText.textContent = "Phát nhạc";
          playing = false;
        } else {
          const savedState = localStorage.getItem("musicState");
          if (savedState) {
            const state = JSON.parse(savedState);
            music.currentTime = parseFloat(state.currentTime) || 0;
          }
          attemptPlay();
          if (musicBtn) musicBtn.textContent = "⏸️";
          if (musicText) musicText.textContent = "Tắt nhạc";
          playing = true;
        }
        saveMusicState();
      }

      // Lưu state định kỳ (800ms để resume chính xác khi load chậm)
      function saveMusicState() {
        localStorage.setItem(
          "musicState",
          JSON.stringify({
            playing: playing,
            currentTime: music.currentTime || 0,
          }),
        );
      }

      setInterval(saveMusicState, 800);
      if (musicBtn) musicBtn.addEventListener("click", toggleMusic);
      window.addEventListener("beforeunload", saveMusicState);

      // Unlock toàn site khi ấn bất kỳ đâu (chỉ 1 lần)
      document.addEventListener(
        "click",
        () => {
          if (!hasUserInteracted) {
            hasUserInteracted = true;
            localStorage.setItem("audioUnlocked", "true");

            const saved = localStorage.getItem("musicState");
            if (saved && saved.includes('"playing":true') && music.paused) {
              attemptPlay();
              if (musicBtn) musicBtn.textContent = "⏸️";
              if (musicText) musicText.textContent = "Tắt nhạc";
            }
          }
        },
        { once: true },
      );
    </script>
  </body>
</html>
